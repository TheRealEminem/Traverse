<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Traverse's mark (identity/art.tsx, Logo): the family's tile in rust, its low sun and faint ground lines, and a
       cairn of four flat cream stones, each turned a little. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CC6626"/><stop offset="1" stop-color="#8E3616"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD66A"/><stop offset="1" stop-color="#F49A48"/></linearGradient>
    <clipPath id="c"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <path d="M0 42 C 13 34, 26 34, 38 39 S 56 38, 64 34 V64 H0Z" fill="#fff" fill-opacity="0.07"/>
    <g fill="none" stroke="#F4EEDC" stroke-linecap="round" stroke-width="1.3">
      <path d="M-2 49 C 12 43, 26 44, 38 48 S 56 47, 66 43" opacity="0.2"/>
      <path d="M-2 56 C 14 51, 28 52, 40 55 S 56 54, 66 51" opacity="0.13"/>
    </g>
    <circle cx="45" cy="19" r="7.5" fill="url(#sun)"/>
    <g fill="#F6EBCF">
