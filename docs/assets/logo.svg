    <path d="M7 59 C 17 54, 26 49.5, 36 44.8" fill="none" stroke="#F6EBCF" stroke-width="3.4" stroke-linecap="round"/>
    <g fill="#F6EBCF">
      <ellipse cx="42.2" cy="42" rx="5" ry="2.5"/>
      <ellipse cx="41.9" cy="37.9" rx="3.6" ry="1.9"/>
      <ellipse cx="42.3" cy="34.6" rx="2.3" ry="1.5"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#fff" stroke-opacity="0.16"/>
</svg>
