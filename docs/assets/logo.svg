      <ellipse cx="28.6" cy="41.2" rx="8.8" ry="3" transform="rotate(-4 28.6 41.2)"/>
      <ellipse cx="27.6" cy="35" rx="6.6" ry="2.6" transform="rotate(5 27.6 35)"/>
      <ellipse cx="28.5" cy="29.6" rx="4.2" ry="2.2" transform="rotate(-7 28.5 29.6)"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#fff" stroke-opacity="0.16"/>
</svg>
