<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PROPOSED mark for the project app (working name: Cairn). The family recipe (DESIGN.md §2): a 64×64 tile with
       rx 16, a vertical gradient, a faint lighter hill, two cream contour lines, a low sun and a hairline inner
       border, with the app's own motif in cream. Here: the sky tile DESIGN.md suggests, and a cairn of three
       stones, the trail-marker people stack one at a time. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F86A8"/><stop offset="1" stop-color="#285B7A"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8CB5A"/><stop offset="1" stop-color="#EE8540"/></linearGradient>
    <clipPath id="c"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <path d="M0 42 C 13 34, 26 34, 38 39 S 56 38, 64 34 V64 H0Z" fill="#fff" fill-opacity="0.07"/>
    <g fill="none" stroke="#F4EEDC" stroke-linecap="round" stroke-width="1.3">
      <path d="M-2 49 C 12 43, 26 44, 38 48 S 56 47, 66 43" stroke-opacity="0.2"/>
      <path d="M-2 56 C 14 51, 28 52, 40 55 S 56 54, 66 51" stroke-opacity="0.13"/>
    </g>
    <circle cx="46" cy="19" r="7" fill="url(#sun)"/>
    <g fill="#F6EBCF">
      <path d="M17.5 51.2 C 17.2 47.6, 22.6 45.4, 30.4 45.3 C 38.6 45.2, 44.6 47.2, 44.4 50.9 C 44.2 54.2, 38.4 55.6, 30.6 55.6 C 22.6 55.6, 17.8 54.4, 17.5 51.2 Z"/>
      <path d="M21.6 40.4 C 21.5 37.4, 25.4 35.6, 30.8 35.6 C 36.4 35.6, 40.2 37.3, 40.1 40.2 C 40 43, 36.2 44, 30.9 44 C 25.6 44, 21.7 43.1, 21.6 40.4 Z"/>
      <path d="M25.4 30.6 C 25.4 28.2, 27.9 26.5, 31.2 26.5 C 34.6 26.5, 36.9 28.1, 36.8 30.4 C 36.7 32.7, 34.4 33.9, 31.1 33.9 C 27.8 33.9, 25.4 32.9, 25.4 30.6 Z"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#fff" stroke-opacity="0.16"/>
</svg>
